[project]
name = "cobol-seance"
version = "0.1.0"
description = "Summon the spirits of dead programming languages in your terminal. A retro séance powered by local open-weight AI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "saima" }]
keywords = ["hacktoberfest", "open-source-ai", "retro", "terminal", "séance", "dead-languages"]

dependencies = [
    "textual>=0.85.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
voice = ["elevenlabs>=1.0.0"]
tracing = ["sentry-sdk>=2.0.0"]

[project.scripts]
seance = "seance.__main__:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["seance*"]
